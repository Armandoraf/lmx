name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  verify-version:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Ensure the tag matches every package version
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          version="${RELEASE_TAG#v}"
          test "$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -n 1)" = "$version"
          test "$(sed -n 's/^version = "\(.*\)"/\1/p' python/pyproject.toml | head -n 1)" = "$version"
          test "$(node -p "require('./typescript/package.json').version")" = "$version"

  build-python:
    needs: verify-version
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install --upgrade maturin
      - run: maturin build --release --out ../dist
        working-directory: python
      - uses: actions/upload-artifact@v4
        with:
          name: python-distributions
          path: dist/*

  build-node:
    needs: verify-version
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-14
            target: aarch64-apple-darwin
          - os: macos-13
            target: x86_64-apple-darwin
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
          - os: ubuntu-latest
            target: aarch64-unknown-linux-gnu
            cross: --use-napi-cross
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: typescript/package-lock.json
      - run: npm ci
        working-directory: typescript
      - run: npx napi build --platform --release --target ${{ matrix.target }} ${{ matrix.cross }} --manifest-path ../crates/lmx-node/Cargo.toml --output-dir artifacts --js native.js --dts native.d.ts --esm
        working-directory: typescript
      - uses: actions/upload-artifact@v4
        with:
          name: node-${{ matrix.target }}
          path: typescript/artifacts/*.node

  publish:
    needs: [build-python, build-node]
    runs-on: ubuntu-latest
    environment: release
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          registry-url: https://registry.npmjs.org
          cache: npm
          cache-dependency-path: typescript/package-lock.json
      - run: npm ci
        working-directory: typescript
      - uses: actions/download-artifact@v4
        with:
          pattern: node-*
          path: typescript/artifacts
          merge-multiple: true
      # Bootstrap only: remove NODE_AUTH_TOKEN after npm trusted publishing is configured.
      - run: npm run release:artifacts && npm run release:platforms && npm publish --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        working-directory: typescript
      - uses: actions/download-artifact@v4
        with:
          name: python-distributions
          path: dist
      - uses: pypa/gh-action-pypi-publish@release/v1
