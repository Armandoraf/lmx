name: Publish

on:
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build-native:
    name: Build ${{ matrix.package }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-14
            package: darwin-arm64
            target: aarch64-apple-darwin
          - os: macos-14
            package: darwin-x64
            target: x86_64-apple-darwin
          - os: ubuntu-24.04
            package: linux-x64-gnu
            target: x86_64-unknown-linux-gnu
          - os: ubuntu-24.04-arm
            package: linux-arm64-gnu
            target: aarch64-unknown-linux-gnu
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - uses: dtolnay/rust-toolchain@stable
      - run: rustup target add ${{ matrix.target }}
      - run: npm install
        working-directory: typescript
      - run: npx napi build --target ${{ matrix.target }} --platform --release --manifest-path ../crates/lmx-node/Cargo.toml --output-dir . --js native.js --dts native.d.ts --esm
        working-directory: typescript
      - uses: actions/upload-artifact@v4
        with:
          name: lmx-${{ matrix.package }}
          path: typescript/lmx.*.node
          if-no-files-found: error

  publish:
    needs: build-native
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: https://npm.pkg.github.com
      - run: npm install
        working-directory: typescript
      - uses: actions/download-artifact@v4
        with:
          pattern: lmx-*
          path: typescript/artifacts
          merge-multiple: true
      - run: npm run release:artifacts
        working-directory: typescript
      - run: npm run release:platforms
        working-directory: typescript
        env:
          NODE_AUTH_TOKEN: ${{ github.token }}
      - run: npm publish --ignore-scripts
        working-directory: typescript
        env:
          NODE_AUTH_TOKEN: ${{ github.token }}
