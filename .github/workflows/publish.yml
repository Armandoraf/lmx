name: Publish

on:
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build-native:
    name: Build ${{ matrix.package }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-14
            package: darwin-arm64
          - os: macos-13
            package: darwin-x64
          - os: ubuntu-24.04
            package: linux-x64-gnu
          - os: ubuntu-24.04-arm
            package: linux-arm64-gnu
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - uses: dtolnay/rust-toolchain@stable
      - run: npm ci
        working-directory: typescript
      - run: npm run build:native
        working-directory: typescript
      - uses: actions/upload-artifact@v4
        with:
          name: lmx-${{ matrix.package }}
          path: typescript/lmx.*.node
          if-no-files-found: error

  publish:
    needs: build-native
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: npm ci
        working-directory: typescript
      - uses: actions/download-artifact@v4
        with:
          pattern: lmx-*
          path: typescript/artifacts
          merge-multiple: true
      - run: npm run release:artifacts
        working-directory: typescript
      - run: npm run release:platforms
        working-directory: typescript
        env:
          GITHUB_PACKAGES_TOKEN: ${{ github.token }}
      - run: npm publish --ignore-scripts
        working-directory: typescript
        env:
          GITHUB_PACKAGES_TOKEN: ${{ github.token }}
