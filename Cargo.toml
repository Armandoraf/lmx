[workspace]
members = [
  "crates/lmx-core",
  "crates/lmx-python",
  "crates/lmx-node",
]
resolver = "2"

[workspace.package]
version = "0.2.9"
edition = "2024"
rust-version = "1.89"
license = "MIT"
repository = "https://github.com/Armandoraf/lmx"

[workspace.dependencies]
async-trait = "0.1.89"
base64 = "0.22.1"
eventsource-stream = "0.2.3"
futures-util = "0.3.31"
image = { version = "0.25.8", default-features = false, features = ["jpeg", "png"] }
percent-encoding = "2.3.1"
pyo3 = { version = "0.27.1", features = ["extension-module"] }
reqwest = { version = "0.12.24", default-features = false, features = ["json", "multipart", "rustls-tls", "stream"] }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.145"
thiserror = "2.0.16"
tokio = { version = "1.47.1", features = ["rt", "macros", "sync", "time"] }
tokio-util = { version = "0.7.16", features = ["rt"] }
hmac = "0.12"
sha2 = "0.10"
crc32fast = "1.4"
hex = "0.4"
