[build-system]
requires = ["maturin>=1.9,<2"]
build-backend = "maturin"

[project]
name = "lmx-sdk"
version = "0.4.0"
description = "Unified Python client for documented LLM provider APIs"
requires-python = ">=3.11"
license = { file = "../LICENSE" }
authors = [{ name = "Armandoraf" }]
classifiers = [
  "Development Status :: 3 - Alpha",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Rust",
  "Typing :: Typed",
]

[project.urls]
Homepage = "https://github.com/Armandoraf/lmx"
Documentation = "https://github.com/Armandoraf/lmx#readme"
Repository = "https://github.com/Armandoraf/lmx"
Issues = "https://github.com/Armandoraf/lmx/issues"

[tool.maturin]
manifest-path = "../crates/lmx-python/Cargo.toml"
module-name = "lmx._native"
python-source = "src"
