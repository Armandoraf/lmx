[build-system]
requires = ["maturin>=1.9,<2"]
build-backend = "maturin"

[project]
name = "lmx"
version = "0.1.7"
description = "Python bindings for the LMX provider engine"
requires-python = ">=3.11"

[tool.maturin]
manifest-path = "../crates/lmx-python/Cargo.toml"
module-name = "lmx._native"
python-source = "src"
